name: run-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        filament: ['^4.0', '^5.0']
        dependencies: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} - Filament ${{ matrix.filament }} - ${{ matrix.dependencies }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, fileinfo
          coverage: none
          tools: composer:v2

      - name: Select Filament version
        run: composer require "filament/filament:${{ matrix.filament }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --${{ matrix.dependencies }} --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/pest --ci
